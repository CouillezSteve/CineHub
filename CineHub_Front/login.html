<!doctype html>
<html lang="fr" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connexion · CineHub</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div id="navbar"></div>
  <main class="container">
    <div class="auth-wrapper">
      <div class="text-center mb-4">
        <i class="bi bi-film text-accent display-3"></i>
        <h1 class="h3 mt-2">Bienvenue sur CineHub</h1>
        <p class="text-body-secondary mb-0">Connecte-toi pour réserver tes séances.</p>
      </div>
      <div class="card shadow">
        <div class="card-body p-4">
          <div id="alert"></div>
          <form id="login-form">
            <div class="mb-3">
              <label for="username" class="form-label">Nom d'utilisateur</label>
              <input type="text" class="form-control" id="username" autocomplete="username" required autofocus>
            </div>
            <div class="mb-4">
              <label for="password" class="form-label">Mot de passe</label>
              <input type="password" class="form-control" id="password" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100" id="submit-btn">Se connecter</button>
          </form>
        </div>
      </div>
      <p class="text-center mt-3">Pas encore de compte ? <a href="register.html">Inscris-toi</a></p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
