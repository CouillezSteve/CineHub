<!doctype html>
<html lang="fr" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Détail du film · CineHub</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div id="navbar"></div>
  <main class="container py-4">
    <a href="index.html" class="link-secondary text-decoration-none"><i class="bi bi-arrow-left"></i> Retour aux films</a>
    <div id="alert" class="mt-3"></div>
    <div id="loading" class="text-center py-5"><div class="spinner-border text-secondary" role="status"></div></div>
    <div id="film-content" class="d-none">
      <div class="row g-4 mt-1">
        <div class="col-md-4 col-lg-3" id="film-poster"></div>
        <div class="col-md-8 col-lg-9" id="film-info"></div>
      </div>
      <h2 class="h4 mt-5 mb-3"><i class="bi bi-calendar-event text-accent"></i> Prochaines séances</h2>
      <div id="screenings-list"></div>
    </div>
  </main>
  <div class="modal fade" id="book-modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <form class="modal-content" id="book-form">
        <div class="modal-header">
          <h5 class="modal-title">Réserver une séance</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fermer"></button>
        </div>
        <div class="modal-body">
          <div id="book-alert"></div>
          <p class="mb-3" id="book-summary"></p>
          <label for="book-seats" class="form-label">Nombre de places</label>
          <input type="number" class="form-control" id="book-seats" min="1" step="1" value="1" required>
          <p class="mt-3 mb-0">Total : <strong id="book-total"></strong></p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Annuler</button>
          <button type="submit" class="btn btn-primary" id="book-submit">Confirmer la réservation</button>
        </div>
      </form>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/film.js"></script>
</body>
</html>
