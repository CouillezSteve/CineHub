<!doctype html>
<html lang="fr" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Films à l'affiche · CineHub</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div id="navbar"></div>
  <main class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-4">
      <div>
        <h1 class="h3 mb-1"><i class="bi bi-camera-reels text-accent"></i> À l'affiche</h1>
        <p class="text-body-secondary mb-0">Choisis un film pour voir ses prochaines séances.</p>
      </div>
      <div class="d-flex gap-2">
        <input type="search" class="form-control" id="search" placeholder="Rechercher un titre…" style="min-width: 220px">
        <select class="form-select" id="genre" style="min-width: 160px">
          <option value="">Tous les genres</option>
        </select>
      </div>
    </div>
    <div id="alert"></div>
    <div id="loading" class="text-center py-5"><div class="spinner-border text-secondary" role="status"></div></div>
    <div class="row g-4" id="films-grid"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/films.js"></script>
</body>
</html>
