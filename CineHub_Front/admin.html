<!doctype html>
<html lang="fr" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Administration · CineHub</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div id="navbar"></div>
  <main class="container py-4">
    <h1 class="h3 mb-4"><i class="bi bi-gear text-accent"></i> Administration</h1>
    <div id="admin-alert"></div>

    <ul class="nav nav-tabs mb-3" role="tablist">
      <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-films" type="button">Films</button></li>
      <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-rooms" type="button">Salles</button></li>
      <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-screenings" type="button">Séances</button></li>
      <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-reservations" type="button">Réservations</button></li>
    </ul>

    <div class="tab-content">
      <div class="tab-pane fade show active" id="tab-films">
        <div class="d-flex justify-content-end mb-2">
          <button class="btn btn-primary btn-sm" id="film-new"><i class="bi bi-plus-lg"></i> Nouveau film</button>
        </div>
        <div class="table-responsive">
          <table class="table table-hover">
            <thead><tr><th>#</th><th>Titre</th><th>Genre</th><th>Durée</th><th>Sortie</th><th>Statut</th><th></th></tr></thead>
            <tbody id="films-body"></tbody>
          </table>
        </div>
      </div>

      <div class="tab-pane fade" id="tab-rooms">
        <div class="d-flex justify-content-end mb-2">
          <button class="btn btn-primary btn-sm" id="room-new"><i class="bi bi-plus-lg"></i> Nouvelle salle</button>
        </div>
        <div class="table-responsive">
          <table class="table table-hover">
            <thead><tr><th>#</th><th>Nom</th><th>Capacité</th><th></th></tr></thead>
            <tbody id="rooms-body"></tbody>
          </table>
        </div>
      </div>

      <div class="tab-pane fade" id="tab-screenings">
        <div class="d-flex justify-content-end mb-2">
          <button class="btn btn-primary btn-sm" id="screening-new"><i class="bi bi-plus-lg"></i> Nouvelle séance</button>
        </div>
        <div class="table-responsive">
          <table class="table table-hover">
            <thead><tr><th>#</th><th>Film</th><th>Salle</th><th>Date</th><th>Prix</th><th></th></tr></thead>
            <tbody id="screenings-body"></tbody>
          </table>
        </div>
      </div>

      <div class="tab-pane fade" id="tab-reservations">
        <div class="table-responsive">
          <table class="table table-hover">
            <thead><tr><th>#</th><th>Utilisateur</th><th>Film</th><th>Séance</th><th>Salle</th><th>Places</th><th>Réservé le</th><th></th></tr></thead>
            <tbody id="reservations-body"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
  <!-- Film -->
  <div class="modal fade" id="film-modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <form class="modal-content" id="film-form">
        <div class="modal-header">
          <h5 class="modal-title" id="film-modal-title">Nouveau film</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fermer"></button>
        </div>
        <div class="modal-body">
          <div id="film-alert"></div>
          <input type="hidden" id="film-id">
          <div class="mb-3">
            <label for="film-title" class="form-label">Titre *</label>
            <input type="text" class="form-control" id="film-title" required>
          </div>
          <div class="mb-3">
            <label for="film-description" class="form-label">Description</label>
            <textarea class="form-control" id="film-description" rows="3"></textarea>
          </div>
          <div class="row g-3 mb-3">
            <div class="col-6">
              <label for="film-duration" class="form-label">Durée (min) *</label>
              <input type="number" class="form-control" id="film-duration" min="1" required>
            </div>
            <div class="col-6">
              <label for="film-genre" class="form-label">Genre</label>
              <input type="text" class="form-control" id="film-genre" maxlength="100">
            </div>
          </div>
          <div class="mb-3">
            <label for="film-release" class="form-label">Date de sortie</label>
            <input type="date" class="form-control" id="film-release">
          </div>
          <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" role="switch" id="film-showing" checked>
            <label class="form-check-label" for="film-showing">À l'affiche</label>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Annuler</button>
          <button type="submit" class="btn btn-primary">Enregistrer</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Salle -->
  <div class="modal fade" id="room-modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <form class="modal-content" id="room-form">
        <div class="modal-header">
          <h5 class="modal-title" id="room-modal-title">Nouvelle salle</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fermer"></button>
        </div>
        <div class="modal-body">
          <div id="room-alert"></div>
          <input type="hidden" id="room-id">
          <div class="mb-3">
            <label for="room-name" class="form-label">Nom *</label>
            <input type="text" class="form-control" id="room-name" maxlength="100" required>
          </div>
          <div class="mb-3">
            <label for="room-capacity" class="form-label">Capacité (places) *</label>
            <input type="number" class="form-control" id="room-capacity" min="1" required>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Annuler</button>
          <button type="submit" class="btn btn-primary">Enregistrer</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Séance -->
  <div class="modal fade" id="screening-modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <form class="modal-content" id="screening-form">
        <div class="modal-header">
          <h5 class="modal-title" id="screening-modal-title">Nouvelle séance</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fermer"></button>
        </div>
        <div class="modal-body">
          <div id="screening-alert"></div>
          <input type="hidden" id="screening-id">
          <div class="mb-3">
            <label for="sc-film" class="form-label">Film *</label>
            <select class="form-select" id="sc-film" required></select>
          </div>
          <div class="mb-3">
            <label for="sc-room" class="form-label">Salle *</label>
            <select class="form-select" id="sc-room" required></select>
          </div>
          <div class="row g-3">
            <div class="col-7">
              <label for="sc-datetime" class="form-label">Date et heure *</label>
              <input type="datetime-local" class="form-control" id="sc-datetime" required>
            </div>
            <div class="col-5">
              <label for="sc-price" class="form-label">Prix (€) *</label>
              <input type="number" class="form-control" id="sc-price" min="0" step="0.01" required>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Annuler</button>
          <button type="submit" class="btn btn-primary">Enregistrer</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Confirmation de suppression -->
  <div class="modal fade" id="confirm-modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Confirmer la suppression</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fermer"></button>
        </div>
        <div class="modal-body" id="confirm-text"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Annuler</button>
          <button type="button" class="btn btn-danger" id="confirm-ok">Supprimer</button>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
